#overlay .card{max-width:520px;background:#172630;border:1px solid #ffffff35;border-radius:20px;padding:24px}
#overlay h1{letter-spacing:.18em;margin:0 0 8px}#overlay p{line-height:1.8;color:#d3dce2;font-size:14px}
#start{background:#b84a31;border:0;padding:13px 24px;font-size:15px}

<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="panel"><div id="title">祭走 - SAISOU</div><div id="stats">速度 0 km/h<br>閻魔との距離 34 m</div><div class="speed-track"><div id="speedFill"></div></div></div>
    <div class="panel" id="status">試作コース：古都・宵町</div>
  </div>
  <div id="warning">閻魔が迫っている！</div>
  <div id="buttons"><button id="camera">視点：追尾</button><button id="reset">リセット</button></div>

  </div>
</div>
<div id="overlay"><div class="card"><h1>祭走</h1><div style="letter-spacing:.2em;color:#d79b64">SAISOU / 3D PHYSICS PROTOTYPE</div>
<p>京都風の古都を、山車を操って駆け抜けよう。<br>建物にぶつからないように進み、背後から迫る閻魔を振り切れ。</p>
<p>この試作では、山車の慣性・旋回の遅れ・建物衝突に加え、横断する人や路上の障害物を避ける走行を体験できます。<br>画面右上のボタン、または C キーでカメラを切り替えられます。</p>
<button id="start">出走する</button></div></div>

  // Pedestrians cross at a measured pace. The player must steer around them.
  for(const h of hazardMeshes){
    if(h.kind==="person"){
      const cross=Math.sin(elapsed*1.05+h.phase);
      h.group.position.x=h.baseX+cross*2.25;
      h.group.position.z=h.baseZ+Math.sin(elapsed*.55+h.phase)*.35;
      h.group.rotation.y=cross>0?Math.PI/2:-Math.PI/2;
      h.group.children[2].rotation.x=Math.sin(elapsed*5+h.phase)*.22;
      h.group.children[3].rotation.x=-Math.sin(elapsed*5+h.phase)*.22;
    }
    const dx=np.x-h.group.position.x,dz=np.z-h.group.position.z;
    const near=Math.hypot(dx,dz);
    if(near<(h.kind==="person"?1.9:1.75)){
      const impulseScale=h.kind==="person"?0.30:0.52;
      const nx=dx/(near||1),nz=dz/(near||1);
      floatBody.applyImpulse({x:nx*impulseScale,y:0,z:nz*impulseScale},true);
      floatBody.applyImpulse({x:-v.x*.035,y:0,z:-v.z*.035},true);
      shake=Math.max(shake,.10);
      if(h.kind==="person") document.querySelector('#status').textContent="人の横断に注意！";
      else document.querySelector('#status').textContent="路上の障害物に接触！";
    }
  }

  // Enma steadily closes in; collisions and low speed make the chase more dangerous
  const targetZ=np.z+chaseDistance;chaseDistance=Math.max(1.8,chaseDistance-(4.0+Math.max(0,8-speed)*.18)*dt);
  demon.position.x+=(np.x-demon.position.x)*Math.min(1,dt*1.4);demon.position.z+=(targetZ-demon.position.z)*Math.min(1,dt*2.0);
  demon.rotation.y=Math.PI;
  const danger=chaseDistance<15;document.querySelector('#warning').style.opacity=chaseDistance<19?1:0; if(chaseDistance>=19) document.querySelector('#status').textContent="試作コース：古都・宵町";
  document.querySelector('#stats').innerHTML=`速度 ${Math.round(speed*3.6)} km/h<br>閻魔との距離 ${Math.round(chaseDistance)} m`;document.querySelector('#speedFill').style.width=`${Math.min(100,speed/MAX_SPEED*100)}%`;
  if(chaseDistance<=2){gameOver=true;document.querySelector('#overlay').style.display='flex';document.querySelector('#overlay h1').textContent='捕まった';document.querySelector('#overlay p').innerHTML='閻魔に追いつかれてしまった。<br>もう一度、古都を駆け抜けよう。';document.querySelector('#start').textContent='再挑戦する'}
  if(Math.abs(np.x)>78||Math.abs(np.z)>78){floatBody.setLinvel({x:v.x*.7,y:v.y,z:v.z*.7},true)}
  shake=danger?Math.sin(elapsed*23)*.04:0;
 }
 const p=floatBody.translation();
 const heading=new THREE.Vector3(-Math.sin(driveYaw),0,-Math.cos(driveYaw));
 let desired;
 if(camMode===0)desired=new THREE.Vector3(p.x-heading.x*10, p.y+6.5, p.z-heading.z*10);
 else if(camMode===1)desired=new THREE.Vector3(p.x-heading.x*5.2,p.y+3.3,p.z-heading.z*5.2);
 else desired=new THREE.Vector3(p.x,p.y+5.05,p.z);
 camera.position.lerp(desired,.09);const look=new THREE.Vector3(p.x+heading.x*(camMode===2?18:2),p.y+(camMode===2?4.5:2),p.z+heading.z*(camMode===2?18:2));camera.lookAt(look);camera.position.y+=shake;
 renderer.render(scene,camera);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
